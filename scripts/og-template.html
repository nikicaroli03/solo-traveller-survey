<!doctype html>
<!-- Modello dell'immagine di anteprima per i social (public/og.png): npm run og-image -->
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Jakarta';
        src: url('../node_modules/@fontsource-variable/plus-jakarta-sans/files/plus-jakarta-sans-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 200 800;
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        color: #fff8ef;
        font-family: 'Jakarta', system-ui, sans-serif;
        background-color: #0e1c30;
        background-image:
          radial-gradient(rgb(255 248 239 / 0.055) 1.6px, transparent 1.8px),
          radial-gradient(ellipse 78% 78% at 50% 42%, #15263e, #0e1c30);
        background-size:
          34px 34px,
          100% 100%;
      }
      .glow {
        position: absolute;
        right: -220px;
        bottom: -300px;
        width: 640px;
        height: 640px;
        border-radius: 50%;
        background: rgb(255 122 47 / 0.14);
        filter: blur(120px);
      }
      .content {
        position: absolute;
        left: 90px;
        top: 86px;
        right: 90px;
      }
      .logo {
        width: 620px;
        display: block;
      }
      .tag {
        display: inline-block;
        margin-top: 46px;
        padding: 10px 22px;
        background: rgb(255 248 239 / 0.1);
        border-radius: 999px;
        color: #ff7a2f;
        font-size: 26px;
        font-weight: 700;
      }
      p {
        margin-top: 22px;
        font-size: 38px;
        color: #b9c3d2;
        font-weight: 500;
        max-width: 900px;
        line-height: 1.3;
      }
      .route {
        position: absolute;
        left: 90px;
        right: 90px;
        bottom: 72px;
        height: 4px;
        background: repeating-linear-gradient(
          90deg,
          rgb(255 248 239 / 0.3) 0 14px,
          transparent 14px 26px
        );
      }
      .route::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        height: 4px;
        width: 72%;
        border-radius: 4px;
        background: #ff7a2f;
      }
      .plane {
        position: absolute;
        left: calc(90px + (1020px * 0.72) - 28px);
        bottom: 46px;
        width: 56px;
        height: 56px;
        color: #ff7a2f;
        transform: rotate(45deg);
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="content">
      <img
        class="logo"
        src="../src/assets/solo-travellers-tagline-dark.svg"
        alt="Solo Travellers. Leave solo, Link together."
      />
      <div class="tag">Questionario · Università di Bologna · 5 minuti</div>
      <p>Ci aiuti a migliorare la piattaforma per chi viaggia da solo?</p>
    </div>
    <div class="route"></div>
    <svg class="plane" viewBox="0 0 24 24" fill="currentColor">
      <path
        d="M21.4 2.6c.7.7.5 1.9-.4 2.8l-3.7 3.7 2.2 9.3-1.8 1.8-4.4-7.2-3.8 3.8.4 2.9-1.3 1.3-1.9-3.6-3.6-1.9 1.3-1.3 2.9.4 3.8-3.8-7.2-4.4 1.8-1.8 9.3 2.2 3.7-3.7c.9-.9 2.1-1.1 2.7-.5z"
      />
    </svg>
  </body>
</html>
