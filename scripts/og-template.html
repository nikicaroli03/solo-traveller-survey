<!doctype html>
<!-- Modello dell'immagine di anteprima per i social (public/og.png): npm run og-image -->
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Jakarta';
        src: url('../node_modules/@fontsource-variable/plus-jakarta-sans/files/plus-jakarta-sans-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 200 800;
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        background: #0b0d12;
        color: #fff;
        font-family: 'Jakarta', system-ui, sans-serif;
      }
      .glow {
        position: absolute;
        border-radius: 50%;
        filter: blur(110px);
      }
      .dots {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgb(255 255 255 / 0.08) 1.4px, transparent 1.4px);
        background-size: 26px 26px;
      }
      .content {
        position: absolute;
        left: 90px;
        top: 96px;
        right: 90px;
      }
      .tag {
        display: inline-block;
        padding: 10px 20px;
        border: 2px solid rgb(93 224 230 / 0.4);
        background: rgb(93 224 230 / 0.1);
        border-radius: 999px;
        color: #5de0e6;
        font-size: 26px;
        font-weight: 700;
      }
      h1 {
        margin-top: 34px;
        font-size: 112px;
        font-weight: 800;
        letter-spacing: -3px;
        line-height: 1;
      }
      h1 span {
        background: linear-gradient(90deg, #5de0e6, #fe2c55);
        -webkit-background-clip: text;
        color: transparent;
      }
      p {
        margin-top: 26px;
        font-size: 38px;
        color: #a9b2c0;
        font-weight: 500;
        max-width: 860px;
        line-height: 1.3;
      }
      .route {
        position: absolute;
        left: 90px;
        right: 90px;
        bottom: 84px;
        height: 4px;
        background: repeating-linear-gradient(
          90deg,
          rgb(255 255 255 / 0.3) 0 14px,
          transparent 14px 26px
        );
      }
      .route::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        height: 4px;
        width: 72%;
        border-radius: 4px;
        background: linear-gradient(90deg, #5de0e6, #fe2c55);
      }
      .plane {
        position: absolute;
        left: calc(90px + (1020px * 0.72) - 28px);
        bottom: 58px;
        width: 56px;
        height: 56px;
        color: #5de0e6;
        transform: rotate(45deg);
        filter: drop-shadow(0 0 14px rgb(93 224 230 / 0.8));
      }
      .time {
        position: absolute;
        right: 90px;
        bottom: 116px;
        font-size: 26px;
        color: #a9b2c0;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div
      class="glow"
      style="
        width: 620px;
        height: 620px;
        left: -200px;
        top: -260px;
        background: rgb(93 224 230 / 0.28);
      "
    ></div>
    <div
      class="glow"
      style="
        width: 640px;
        height: 640px;
        right: -220px;
        bottom: -300px;
        background: rgb(254 44 85 / 0.24);
      "
    ></div>
    <div class="dots"></div>
    <div class="content">
      <div class="tag">Questionario · Università di Bologna</div>
      <h1>Solo trave<span>LL</span>ers</h1>
      <p>Ci aiuti con 5 minuti a migliorare la piattaforma per chi viaggia da solo?</p>
    </div>
    <div class="time">⏱ circa 5 minuti</div>
    <div class="route"></div>
    <svg class="plane" viewBox="0 0 24 24" fill="currentColor">
      <path
        d="M21.4 2.6c.7.7.5 1.9-.4 2.8l-3.7 3.7 2.2 9.3-1.8 1.8-4.4-7.2-3.8 3.8.4 2.9-1.3 1.3-1.9-3.6-3.6-1.9 1.3-1.3 2.9.4 3.8-3.8-7.2-4.4 1.8-1.8 9.3 2.2 3.7-3.7c.9-.9 2.1-1.1 2.7-.5z"
      />
    </svg>
  </body>
</html>
